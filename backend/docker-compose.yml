services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: revision-postgres
    environment:
      POSTGRES_USER: doctask
      POSTGRES_PASSWORD: doctask
      POSTGRES_DB: doctask
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/datab

volumes:
  postgres_data: