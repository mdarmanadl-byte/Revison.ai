<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 36 36"
  width="100%"
  height="100%"
>
  <defs>
    <!-- Gradient from-[#7C3AED] to-[#2563EB] -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Shadow matching shadow-purple-900/20 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="3"
        flood-color="#581C87"
        flood-opacity="0.3"
      />
    </filter>
  </defs>

  <!-- Rounded Box Container -->
  <rect
    width="36"
    height="36"
    rx="12"
    fill="url(#bg-gradient)"
    filter="url(#shadow)"
  />

  <!-- Center Group: Nested Diamond Rings -->
  <g fill="#FFFFFF">
    <!-- Outer Diamond Border (Hollow Ring) -->
    <path
      d="M18 8L28 18L18 28L8 18L18 8ZM18 10.8L10.8 18L18 25.2L25.2 18L18 10.8Z"
    />
    
    <!-- Inner Solid Diamond -->
    <path d="M18 14L22 18L18 22L14 18L18 14Z" />
  </g>
</svg>
